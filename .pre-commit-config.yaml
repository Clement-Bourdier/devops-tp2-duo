repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
   - id: end-of-file-fixer
   - id: trailing-whitespace
   - id: check-yaml
- repo: https://github.com/gitleaks/gitleaks
  rev: v8.24.2
  hooks:
   - id: gitleaks
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.17.4
  hooks:
   - id: ruff-check
     args: [ --fix]
   - id: ruff-format
